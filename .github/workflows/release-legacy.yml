name: Build legacy Windows release candidate (32-bit, Windows 7/8/8.1)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      matrix:
        arch: [ia32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (x64)
        if: matrix.arch == 'x64'
        working-directory: legacy
        run: npm install --no-audit --no-fund
      - name: Install dependencies (ia32, without ffmpeg-static's x64-only downloader)
        if: matrix.arch == 'ia32'
        working-directory: legacy
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Fetch and verify 32-bit ffmpeg.exe
        if: matrix.arch == 'ia32'
        working-directory: legacy
        env:
          FFMPEG_IA32_URL: ${{ vars.FFMPEG_IA32_URL }}
        run: node fetch-ffmpeg.mjs
      - name: Stage and verify legacy sources
        working-directory: legacy
        run: |
          npm run stage
          npm run verify
      - name: Build installer
        working-directory: legacy
        run: npm run dist:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-legacy-windows-${{ matrix.arch }}
          path: legacy/release/Awesome-Downloader-Legacy-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
