name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Enable Corepack on the Node that setup-node installs, so `yarn` is the Yarn 4
      # pinned in package.json rather than the runner's global Yarn 1.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      # The pinned, checksum-verified yt-dlp for YouTube page links (see THIRD-PARTY.md).
      - run: yarn fetch:yt-dlp win32
      - run: yarn dist
      - name: Check that yt-dlp is bundled
        shell: powershell
        run: if (-not (Test-Path release/win-unpacked/resources/tools/yt-dlp.exe)) { throw 'yt-dlp.exe is missing from the app' }
      - name: Create SHA-256 file
        shell: powershell
        run: (Get-FileHash release/Awesome-Downloader-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  Awesome-Downloader-Setup.exe' | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-release-candidate
          path: |
            release/Awesome-Downloader-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  package-extension:
    # The Chrome Web Store submission package; the same on every platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Enable Corepack on the Node that setup-node installs, so `yarn` is the Yarn 4
      # pinned in package.json rather than the runner's global Yarn 1.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: yarn install --immutable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: yarn package:extension
      - name: Create SHA-256 file
        working-directory: release-extension
        run: sha256sum Awesome-Downloader-Extension-*.zip > SHA256SUMS-extension.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-store-package
          path: |
            release-extension/Awesome-Downloader-Extension-*.zip
            release-extension/SHA256SUMS-extension.txt
          if-no-files-found: error
          retention-days: 7
  build-mac:
    # macos-latest is Apple Silicon, so the x64 app is cross-built. ffmpeg-static only installs
    # the arm64 FFmpeg here; scripts/after-pack.cjs swaps in the x64 one.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Enable Corepack on the Node that setup-node installs, so `yarn` is the Yarn 4
      # pinned in package.json rather than the runner's global Yarn 1.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      # yt-dlp_macos is a universal binary, so the same file serves both apps.
      - run: yarn fetch:yt-dlp darwin
      - run: yarn dist:mac
      - name: Check Electron and FFmpeg architectures and the bundled yt-dlp
        working-directory: release
        run: |
          for build in mac-arm64:arm64 mac:x86_64; do
            app="${build%%:*}/Awesome Downloader.app/Contents"
            for binary in "MacOS/Awesome Downloader" Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg; do
              echo "$app/$binary: $(lipo -archs "$app/$binary")"
              test "$(lipo -archs "$app/$binary")" = "${build#*:}"
            done
            echo "$app/Resources/tools/yt-dlp: $(lipo -archs "$app/Resources/tools/yt-dlp")"
            test -x "$app/Resources/tools/yt-dlp"
          done
      - name: Create SHA-256 file
        working-directory: release
        run: shasum -a 256 Awesome-Downloader-*-mac-arm64.dmg Awesome-Downloader-*-mac-x64.dmg > SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-release-candidate
          path: |
            release/Awesome-Downloader-*-mac-arm64.dmg
            release/Awesome-Downloader-*-mac-x64.dmg
            release/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 7
