# electron-builder packages from a real node_modules folder, so Plug'n'Play is off.
nodeLinker: node-modules

# Some dependencies expect a peer that their parent package never passes on. Declaring
# those peers lets Yarn hand over the project's own copies, so installs report no warnings.
packageExtensions:
  '@next/eslint-plugin-next@*':
    peerDependencies:
      eslint: '*'
  eslint-config-airbnb-extended@*:
    peerDependencies:
      typescript: '*'
  # Only needed for Squirrel.Windows installers, which this project does not build.
  app-builder-lib@*:
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
